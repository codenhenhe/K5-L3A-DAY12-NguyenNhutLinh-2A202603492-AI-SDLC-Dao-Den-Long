<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0E1430">
  <title>Đảo Đèn Lồng</title>
  <link rel="stylesheet" href="style.css">
  <script src="audio.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <main>
    <canvas id="island" aria-label="Đảo Đèn Lồng, khung cảnh 3D"></canvas>
    <div class="hud" id="hud" hidden>
      <div class="hud-left">
        <div class="identity" id="night-label">ĐÊM 1 · ĐẢO BẾN</div>
        <div class="flames" id="flames" aria-label="Ngọn lửa"></div>
        <div id="terrain-level" hidden></div>
      </div>
      <div class="clock" id="time" aria-label="Thời gian"></div>
      <div class="ledger">
        <div><span>Đèn sáng</span><strong id="lamps"></strong><span id="dawn-goal"></span></div>
        <div><span>Điểm</span><strong id="score"></strong></div>
      </div>
      <div class="carry">
        <div id="motes" class="mote-cells" aria-label="Đom đóm"></div>
        <strong id="carry-count"></strong>
      </div>
      <div class="abilities">
        <div><kbd id="dash-key">Shift</kbd><span>Lướt</span><strong id="dash-cd"></strong></div>
        <div><kbd id="pulse-key">F</kbd><span>Tỏa sáng</span><strong id="pulse-cd"></strong></div>
        <span id="charm-timer" hidden></span>
      </div>
      <p id="wind" class="urgent" role="status" hidden></p>
      <p id="caption" class="urgent" role="status" hidden></p>
      <p id="notice" role="status"></p>
    </div>
    <footer id="controls">
      <span><kbd id="move-keys">WASD</kbd> Di chuyển</span>
      <span><kbd>← →</kbd> hoặc kéo chuột</span>
      <span><kbd id="jump-key">Space</kbd> Nhảy</span>
      <span><kbd id="interact-key">E</kbd> Nạp đèn</span>
      <span><kbd id="pause-key">Esc / P</kbd> Tạm dừng</span>
    </footer>
    <section id="curtain" aria-labelledby="title">
      <div class="card">
        <div class="emblem" aria-hidden="true">✦</div>
        <p id="eyebrow" hidden></p>
        <h1 id="title">Đảo Đèn Lồng</h1>
        <p id="description">Gom đom đóm và giữ đảo sáng tới bình minh.</p>
        <div id="settings" hidden>
          <label>Âm lượng <input id="volume" type="range" min="0" max="1" step=".05"></label>
          <label>Độ nhạy chuột <input id="sensitivity" type="range" min=".25" max="2.5" step=".05"></label>
          <label>Bảng màu dễ phân biệt <input id="accessiblePalette" type="checkbox"></label>
          <label>Giảm chuyển động <input id="reducedMotion" type="checkbox"></label>
          <label>Chữ lớn <input id="largeText" type="checkbox"></label>
          <details id="key-settings">
            <summary>Đổi phím</summary>
            <div id="bindings"></div>
            <p id="binding-status" role="status"></p>
            <button id="reset-bindings" type="button" class="secondary">Khôi phục mặc định</button>
          </details>
        </div>
        <form id="score-form" hidden>
          <label for="player-name">Tên trên bảng xếp hạng</label>
          <div><input id="player-name" name="name" maxlength="12" pattern="[A-Za-z0-9_]{3,12}"
              autocomplete="off" placeholder="3–12 ký tự" required>
            <button type="submit">Lưu điểm</button></div>
          <p id="save-status" role="status"></p>
        </form>
        <div id="leaderboard" hidden></div>
        <div id="actions"><button type="button">Bắt đầu</button></div>
      </div>
    </section>
    <output id="benchmark" hidden aria-label="Chỉ số hiệu năng"></output>
  </main>
</body>
</html>
