<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0E1430">
  <title>Đảo Đèn Lồng</title>
  <link rel="stylesheet" href="style.css">
  <script src="audio.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <main>
    <canvas id="island" aria-label="Đảo Đèn Lồng, khung cảnh 3D"></canvas>
    <div class="hud" id="hud" hidden>
      <div class="hud-left">
        <div class="identity" id="night-label">ĐÊM 1 · ĐẢO BẾN</div>
        <div class="flames" id="flames" aria-label="Ngọn lửa"></div>
      </div>
      <div class="clock" id="time" aria-label="Thời gian"></div>
      <div class="ledger">
        <div><span>Đèn sáng</span><strong id="lamps"></strong></div>
        <div><span>Điểm</span><strong id="score"></strong></div>
      </div>
      <div class="carry" id="motes" aria-label="Đom đóm"></div>
      <div class="abilities">
        <div><kbd>Shift</kbd><span>Lướt</span><strong id="dash-cd"></strong></div>
        <div><kbd>F</kbd><span>Tỏa sáng</span><strong id="pulse-cd"></strong></div>
        <span id="charm-timer" hidden></span>
      </div>
      <p id="wind" role="status" hidden></p>
      <p id="notice" role="status"></p>
    </div>
    <footer id="controls">
      <span><kbd>WASD</kbd> Di chuyển</span>
      <span><kbd>← →</kbd> hoặc kéo chuột</span>
      <span><kbd>Space</kbd> Nhảy</span>
      <span><kbd>E</kbd> Nạp đèn</span>
      <span><kbd>Esc / P</kbd> Tạm dừng</span>
    </footer>
    <section id="curtain" aria-labelledby="title">
      <div class="card">
        <div class="emblem" aria-hidden="true">✦</div>
        <p id="eyebrow" hidden></p>
        <h1 id="title">Đảo Đèn Lồng</h1>
        <p id="description">Theo Mây qua ba đêm, gom đom đóm và thắp đèn tìm đường về bình minh.</p>
        <div id="settings" hidden>
          <label>Âm lượng <input id="volume" type="range" min="0" max="1" step=".05"></label>
          <label>Độ nhạy chuột <input id="sensitivity" type="range" min=".25" max="2.5" step=".05"></label>
        </div>
        <div id="actions"><button type="button">Bắt đầu</button></div>
      </div>
    </section>
    <output id="benchmark" hidden aria-label="Chỉ số hiệu năng"></output>
  </main>
</body>
</html>
