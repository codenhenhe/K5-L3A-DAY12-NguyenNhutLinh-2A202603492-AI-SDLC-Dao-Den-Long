name: Phase 1 verification

on: [push, pull_request]

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: sh scripts/verify-phase-1.sh
